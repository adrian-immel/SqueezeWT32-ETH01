; SqueezeWT32-ETH01 - Squeezebox (Logitech Media Server) player for the
; Wireless-Tag WT32-ETH01 board (ESP32-D0WD, no PSRAM) with a PCM5102A I2S DAC.
;
; Build:   pio run
; Flash:   pio run -t upload
; Logs:    pio device monitor
;
; PLATFORM: The official platformio "espressif32" only ships an old
; Arduino-ESP32 core at IDF 4.x. ESP8266Audio needs IDF 5.x (the new I2S
; driver) and errors with `driver/i2s_std.h: No such file or directory`.
; Per https://github.com/earlephilhower/ESP8266Audio#esp32-and-platformio we
; use the community pioarduino platform built from the current Espressif
; Arduino core (here pinned to 55.03.311 = Arduino core 3.3.11 / IDF 5.5.5).
;
; NOTE: on Arduino core >= 3.1.0 the ETH.begin() argument order is
;   begin(phy_type, phy_addr, mdc, mdio, power, clk_mode)
; (see src/main.cpp).

[env:wt32-eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = wt32-eth01
framework = arduino
monitor_speed = 115200

; ESP8266Audio (software FLAC/MP3/WAV decode -> I2S) drives the PCM5102A.
; Latest version requires the IDF 5.x new I2S driver provided by the pioarduino
; platform above.
lib_deps =
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2

; Keep the boot output quiet; saves a bit of SRAM as well.
; Give the Arduino loopTask a bit more stack than the 8KB default so the
; FLAC/MP3 decoders have some headroom.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_LOOP_STACK_SIZE=16384
