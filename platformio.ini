; SqueezeWT32-ETH01 - Squeezebox (Logitech Media Server) player for the
; Wireless-Tag WT32-ETH01 board (ESP32-D0WD, no PSRAM) with a PCM5102A I2S DAC.
;
; Build:   pio run
; Flash:   pio run -t upload
; Logs:    pio device monitor

[env:wt32-eth01]
platform = espressif32@7.1.1
board = wt32-eth01
framework = arduino
monitor_speed = 115200

; Pin the exact Arduino-ESP32 core build : 3.0.x uses the
; ETH.begin(addr, power, mdc, mdio, type, clk) argument order (see src/main.cpp).
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20017.241212

; ESP8266Audio (software FLAC/MP3/WAV decode -> I2S) drives the PCM5102A.
; NOTE: pinned to 2.2.0 on purpose. The classic (PSRAM-less) ESP32 only has
; the *legacy* I2S driver on Arduino-ESP32 3.x, while ESP8266Audio >= 2.3.0
; requires the new i2s_std driver which exists only on ESP32-S2/S3/C3.
lib_deps =
    https://github.com/earlephilhower/ESP8266Audio.git#2.2.0

; Keep the boot output quiet; saves a bit of SRAM as well.
build_flags =
    -DCORE_DEBUG_LEVEL=0
